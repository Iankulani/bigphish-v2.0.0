# .gitlab-ci.yml for Scorpion-Effect

stages:
  - security-scan
  - build
  - test
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  ALPINE_VERSION: "3.19"
  
cache:
  paths:
    - .pip-cache/

# Security scan stage
security-scan:
  stage: security-scan
  image: python:3.11-alpine
  before_script:
    - pip install bandit safety
  script:
    # Bandit security scan
    - bandit -r . -f json -o bandit-report.json || true
    # Check vulnerable dependencies
    - safety check --json > safety-report.json || true
    # Secret detection
    - grep -r "API_KEY\|SECRET\|TOKEN" --exclude-dir=.git . || true
  artifacts:
    paths:
      - bandit-report.json
      - safety-report.json
    expire_in: 1 week

# Build Alpine Docker image
build-alpine:
  stage: build
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Build Alpine image
    - docker build --build-arg ALPINE_VERSION=$ALPINE_VERSION -t $DOCKER_IMAGE-alpine -f Dockerfile .
    - docker tag $DOCKER_IMAGE-alpine $CI_REGISTRY_IMAGE:latest-alpine
    # Push images
    - docker push $DOCKER_IMAGE-alpine
    - docker push $CI_REGISTRY_IMAGE:latest-alpine
  only:
    - main
    - develop

# Build slim Alpine image
build-alpine-slim:
  stage: build
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind
  script:
    - docker build --build-arg ALPINE_VERSION=$ALPINE_VERSION -t $CI_REGISTRY_IMAGE:slim-alpine -f Dockerfile.slim .
    - docker push $CI_REGISTRY_IMAGE:slim-alpine
  only:
    - main

# Unit tests
unit-tests:
  stage: test
  image: python:3.11-alpine
  before_script:
    - apk add --no-cache gcc musl-dev libffi-dev
    - pip install pytest pytest-cov pytest-asyncio
    - pip install -r requirements.txt
  script:
    - pytest tests/ -v --cov=. --cov-report=term --cov-report=html
    - pytest tests/test_phishing.py -v
    - pytest tests/test_network.py -v
  artifacts:
    paths:
      - htmlcov/
    expire_in: 1 week
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'

# Integration tests
integration-tests:
  stage: test
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind
  script:
    - docker-compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tester
    - docker-compose -f docker-compose.test.yml down
  only:
    - merge_requests
    - main

# Performance tests
performance-test:
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      echo "Running performance tests..."
      for i in {1..10}; do
        curl -s -o /dev/null -w "Request $i: %{time_total}s\n" http://localhost:5000/api/status
      done
  only:
    - main

# Deploy to staging
deploy-staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $STAGING_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $STAGING_USER@$STAGING_HOST "
        docker pull $CI_REGISTRY_IMAGE:latest-alpine
        docker stop scorpion-effect || true
        docker rm scorpion-effect || true
        docker run -d \
          --name scorpion-effect \
          --restart unless-stopped \
          -p 5000:5000 \
          -p 8080:8080 \
          -v scorpion-data:/app/.scorpion-effect \
          $CI_REGISTRY_IMAGE:latest-alpine
      "
  environment:
    name: staging
    url: https://staging.scorpion.local
  only:
    - develop

# Deploy to production
deploy-production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_PROD" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - |
      ssh $PROD_USER@$PROD_HOST "
        cd /opt/scorpion-effect
        docker-compose pull
        docker-compose up -d --force-recreate
        docker system prune -f
      "
  environment:
    name: production
    url: https://scorpion.cyber.local
  only:
    - main
  when: manual

# Security hardening check
security-hardening:
  stage: test
  image: aquasec/trivy:latest
  script:
    - trivy image --severity HIGH,CRITICAL --no-progress $DOCKER_IMAGE-alpine
  only:
    - main