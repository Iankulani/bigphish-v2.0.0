# nginx.conf for BIG-PHISH HTTPS reverse proxy

events {
    worker_connections 1024;
}

http {
    upstream bigphish_backend {
        server bigphish:8080;
        keepalive 32;
    }

    server {
        listen 443 ssl http2;
        server_name bigphish.local;
        
        ssl_certificate /etc/nginx/ssl/bigphish.crt;
        ssl_certificate_key /etc/nginx/ssl/bigphish.key;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        
        client_max_body_size 50M;
        
        location / {
            proxy_pass http://bigphish_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_buffering off;
            proxy_cache off;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        location /api {
            proxy_pass http://bigphish_backend/api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /ws {
            proxy_pass http://bigphish_backend/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    
    server {
        listen 80;
        server_name bigphish.local;
        return 301 https://$server_name$request_uri;
    }
}